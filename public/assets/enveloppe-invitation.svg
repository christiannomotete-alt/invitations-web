<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Enveloppe invitation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef3ff"/>
      <stop offset="100%" stop-color="#dfe9ff"/>
    </linearGradient>
    <linearGradient id="envTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#edf2ff"/>
    </linearGradient>
    <linearGradient id="envBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e6edff"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#1a2e6d" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="170" cy="120" r="170" fill="#d6e4ff" opacity="0.5"/>
  <circle cx="1080" cy="80" r="140" fill="#e4d8ff" opacity="0.4"/>
  <circle cx="1050" cy="590" r="180" fill="#d0e2ff" opacity="0.45"/>

  <g filter="url(#shadow)" transform="translate(200 120)">
    <rect x="110" y="170" width="580" height="310" rx="18" fill="url(#envBottom)" stroke="#b6c9f8" stroke-width="3"/>
    <path d="M110 220 L400 380 L690 220" fill="none" stroke="#b6c9f8" stroke-width="3"/>
    <path d="M110 170 L400 360 L690 170" fill="url(#envTop)" stroke="#b6c9f8" stroke-width="3"/>

    <g transform="translate(170 75)">
      <rect x="0" y="0" width="460" height="250" rx="18" fill="url(#card)" stroke="#c8d7ff" stroke-width="2.5"/>
      <text x="230" y="62" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#1d2f63">INVITATION</text>
      <line x1="70" y1="95" x2="390" y2="95" stroke="#d7e2ff" stroke-width="2"/>
      <text x="70" y="132" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#284183">Date :</text>
      <text x="160" y="132" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#2b3f74">15 Aout 2026</text>
      <text x="70" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#284183">Lieu :</text>
      <text x="160" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#2b3f74">Lome</text>
      <text x="70" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#425785">Cliquez pour ouvrir votre invitation</text>
    </g>

    <circle cx="400" cy="325" r="36" fill="#2f66d7"/>
    <text x="400" y="336" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">RSVP</text>
  </g>

  <text x="600" y="585" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#20366f">Ouvrez votre enveloppe d'invitation</text>
</svg>
